name: Publish meeting web app

# Every merge to main that touches the web app publishes it to https://rafiqbuilders.web.app.
# "Run workflow" on the Actions page publishes it by hand.
on:
  push:
    branches: [main, claude/web-publish-fix]
    paths: ["web/**", "firebase.json", ".firebaserc", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Waiting for the Firebase key
        if: env.HAS_KEY != 'true'
        run: echo "::warning::Add the FIREBASE_SERVICE_ACCOUNT secret to publish the web app."

      - name: Stamp the version (the open page shows an Update bar when this changes)
        if: env.HAS_KEY == 'true'
        run: echo "{\"version\":\"${GITHUB_SHA::7}\",\"at\":\"$(date -u +%FT%TZ)\"}" > web/version.json

      - name: Publish to Firebase Hosting
        if: env.HAS_KEY == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx -y firebase-tools@13 deploy --only hosting --project rafiq-builders --non-interactive 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          rm -f "$RUNNER_TEMP/sa.json"
          if [ "$status" -ne 0 ]; then
            # Show the reason on the check itself, so it can be read without the full log.
            grep -iE "error|denied|permission|not found|404|403" deploy.log | head -8 | while IFS= read -r l; do echo "::error::$l"; done
            exit "$status"
          fi
