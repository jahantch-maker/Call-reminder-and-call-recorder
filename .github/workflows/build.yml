name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: callback-reminder-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish as "latest" release (easy download on a phone)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CallbackReminder.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CallbackReminder.apk \
            --title "Latest build" \
            --notes "Build #${{ github.run_number }}" \
            --target "${{ github.sha }}"
      - name: Publish CR Test release
        if: github.event_name == 'pull_request' && github.head_ref == 'claude/cr-test-copy'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CRTest.apk
          gh release delete cr-test --yes --cleanup-tag || true
          gh release create cr-test CRTest.apk --title "CR Test build" --prerelease --target "${{ github.event.pull_request.head.sha }}"
