name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle assembleRelease --stacktrace

      - name: Screen tests at every display size
        if: github.event_name == 'pull_request'
        run: gradle testDebugUnitTest --stacktrace

      - name: Show the screen test report and keep the pictures on the ci-screenshots branch
        if: always() && github.event_name == 'pull_request'
        run: |
          cat app/build/screenshots/report.txt || true
          ls app/build/screenshots | head -100 || true
          [ -d app/build/screenshots ] || exit 0
          cd app/build/screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screens for ${{ github.event.pull_request.head.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots

      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: display-size-screenshots
          path: |
            app/build/screenshots
            app/build/reports/tests

      - uses: actions/upload-artifact@v4
        with:
          name: callback-reminder-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish as "latest" release (easy download on a phone)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CallbackReminder.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CallbackReminder.apk \
            --title "Latest build" \
            --notes "Build #${{ github.run_number }}" \
            --target "${{ github.sha }}"
