name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    # A PR that changes only the website (web/) does not build the phone app.
    paths-ignore: ["web/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # The signing key comes from GitHub secrets (never from the code). No secret = an unsigned release build.
      - name: Get the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No signing key set: release APK will be unsigned"
          fi

      - name: Build APK
        run: gradle assembleRelease --stacktrace

      # The fingerprint is public information. It must match the one of the key in the project's private folder.
      - name: Show who signed the app
        run: |
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$AS" verify --print-certs app/build/outputs/apk/full/release/app-full-release.apk | grep -E "SHA-256|Signer #1 certificate DN" || echo "APK is unsigned"

      - name: Screen tests at every display size
        if: github.event_name == 'pull_request'
        run: gradle testFullDebugUnitTest --stacktrace

      - name: Show the screen test report and keep the pictures on the ci-screenshots branch
        if: always() && github.event_name == 'pull_request'
        run: |
          cat app/build/screenshots/report.txt || true
          ls app/build/screenshots | head -100 || true
          [ -d app/build/screenshots ] || exit 0
          cd app/build/screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screens for ${{ github.event.pull_request.head.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots

      # Spare copies are kept 3 days only (storage is small), and a full storage never fails the build.
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        with:
          retention-days: 3
          name: display-size-screenshots
          path: |
            app/build/screenshots
            app/build/reports/tests

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: callback-reminder-apk
          path: app/build/outputs/apk/full/release/app-full-release.apk

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: cr-test-apk
          path: app/build/outputs/apk/cr/release/app-cr-release.apk

      - name: Publish as "latest" release (easy download on a phone)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/full/release/app-full-release.apk CallbackReminder.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CallbackReminder.apk \
            --title "Latest build" \
            --notes "Build #${{ github.run_number }}" \
            --target "${{ github.sha }}"

      # Both apps (main and CR Test) go to the public releases page, where Settings > Update looks for them.
      # The page holds only the app files, no code. Needs the RELEASES_TOKEN secret.
      - name: Publish both apps for the in-app Update button
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: jahantch-maker/callback-reminder-releases
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "RELEASES_TOKEN is not set, skipping"; exit 0; fi
          # A brand new empty page has no commit to tag yet: make one.
          gh api "repos/$REPO/contents/README.md" >/dev/null 2>&1 || \
            gh api -X PUT "repos/$REPO/contents/README.md" -f message="Start" \
              -f content="$(printf '# Callback Reminder builds\n\nOnly the app files. The Update button in the app reads from here.\n' | base64 -w0)"
          CODE=$(grep -m1 'versionCode' app/build.gradle.kts | tr -dc '0-9')
          NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          # v0.59 The newest "What's new" lines go with the version, for the app's "Update required" page.
          NOTES=$(python3 - <<'PY'
          import json, re
          s = open("app/src/main/java/com/callbackreminder/app/ChangeLog.kt", encoding="utf-8").read()
          m = re.search(r'Entry\(\s*"[^"]*",\s*"[^"]*",\s*new = listOf\((.*?)\),\s*fixed', s, re.S)
          lines = [x.replace('\\"', '"') for x in re.findall(r'"((?:[^"\\]|\\.)*)"', m.group(1))] if m else []
          print(json.dumps(lines))
          PY
          )
          publish() {  # channel, apk, version name
            mkdir -p "out/$1"
            cp "$2" "out/$1/app.apk"
            printf '{"versionCode":%s,"versionName":"%s","notes":%s}' "$CODE" "$3" "$NOTES" > "out/$1/version.json"
            gh release delete "$1" --repo "$REPO" --yes --cleanup-tag || true
            gh release create "$1" "out/$1/app.apk" "out/$1/version.json" --repo "$REPO" \
              --title "$1 $3" --notes "Build #${{ github.run_number }}"
          }
          publish main-app app/build/outputs/apk/full/release/app-full-release.apk "$NAME"
          publish test-app app/build/outputs/apk/cr/release/app-cr-release.apk "$NAME-test"
