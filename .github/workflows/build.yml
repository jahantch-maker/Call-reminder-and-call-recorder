name: Build APK

on:
  push:
    branches: [classic]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: callback-reminder-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish as "classic" release (easy download on a phone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CallbackClassic.apk
          gh release delete classic --yes --cleanup-tag || true
          gh release create classic CallbackClassic.apk \
            --title "Callback Classic (frozen v0.35)" --latest=false \
            --notes "Build #${{ github.run_number }}" \
            --target "${{ github.sha }}"
