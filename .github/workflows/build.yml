name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: callback-reminder-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as "latest" release (easy download on a phone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CallbackReminder.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CallbackReminder.apk \
            --title "Latest build" \
            --notes "Build #${{ github.run_number }}" \
            --target "${{ github.sha }}"
